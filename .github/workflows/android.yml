name: Android

on:
  pull_request:
    paths:
      - maincourse-android/**
      - bin/android-*
      - docs/android-release.md
      - .github/workflows/android.yml
  push:
    branches: [ main ]
    paths:
      - maincourse-android/**
      - bin/android-*
      - docs/android-release.md
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMDLINE_TOOLS_VERSION: '16111833'
  ANDROID_PACKAGES: platform-tools build-tools;36.0.0 platforms;android-37.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        id: android-sdk
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}
          packages: ${{ env.ANDROID_PACKAGES }}
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Run unit tests and lint
        run: bin/android-test --continue --no-daemon --stacktrace

      - name: Build debug APK
        if: ${{ !cancelled() && steps.android-sdk.outcome == 'success' }}
        run: bin/android-build --no-daemon --stacktrace

      - name: Upload build outputs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: |
            maincourse-android/app/build/outputs/apk/debug/*.apk
            maincourse-android/app/build/reports/**
            maincourse-android/app/build/test-results/**
          if-no-files-found: ignore

  instrumented-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 29, 36 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.CMDLINE_TOOLS_VERSION }}
          packages: ${{ env.ANDROID_PACKAGES }}
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API ${{ matrix.api-level }} instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: bin/android-gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-api-${{ matrix.api-level }}
          path: |
            maincourse-android/app/build/reports/androidTests/connected/**
            maincourse-android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
