inherit_from: .rubocop_todo.yml

# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Exclude mobile app directory (has its own tooling)
AllCops:
  Exclude:
    - "hauptgang-mobile/**/*"
    - "hauptgang-ios/build/**/*"

# Complexity Metrics
Metrics/CyclomaticComplexity:
  Max: 10  # Default is 7, adjust based on your needs

Metrics/PerceivedComplexity:
  Max: 10  # Accounts for human perception of complexity

Metrics/AbcSize:
  Max: 20  # Assignment, Branch, Condition size

Metrics/MethodLength:
  Max: 15
  CountAsOne: ['array', 'hash', 'heredoc']

Metrics/ClassLength:
  Max: 150

Metrics/BlockLength:
  Max: 25
  CountAsOne: ['array', 'hash', 'heredoc']
  Exclude:
    - 'config/**/*'
    - 'spec/**/*'
    - 'test/**/*'

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# Custom cops
require:
  - ./lib/rubocop/cop/maincourse/migration_table_rebuild.rb

# On SQLite most schema changes rebuild the table, and that rebuild's DROP
# fires every ON DELETE CASCADE / SET NULL pointing at it unless the migration
# opts out of db:migrate's wrapping transaction. See the cop for the full story.
Maincourse/MigrationTableRebuild:
  Enabled: true
  Include:
    - "db/migrate/**/*.rb"
