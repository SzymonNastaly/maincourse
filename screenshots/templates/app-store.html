<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: Plex; src: url("{{font_medium}}"); font-weight: 500; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex; flex-direction: column; align-items: center;
      padding: 5vh 6vw 3vh; gap: 2vh;
      background: {{canvas}}; color: {{ink}}; font-family: Plex, sans-serif;
    }
    h1 {
      flex: none; width: 100%; margin: 0;
      font-size: 9vw; font-weight: 500; line-height: 1.06;
      letter-spacing: -.045em; text-align: center; text-wrap: balance;
    }
    .ipad h1 { font-size: 7.8vw; }
    .device { flex: 1; min-height: 0; width: 100%; object-fit: contain; object-position: top center; }
  </style>
</head>
<body class="{{device}}">
  <h1 data-kou-id="headline">{{headline}}</h1>
  <img class="device" data-kou-id="device" src="{{screen}}" alt="MainCourse app">
</body>
</html>
